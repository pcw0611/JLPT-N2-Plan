<div id="keigo-basics-0828" lang="ja">
  <style>
    #keigo-basics-0828 {color:var(--foreground)}
    #keigo-basics-0828 .space {margin-block:18px}
    #keigo-basics-0828 .choices {display:grid;gap:12px;margin-block:20px}
    #keigo-basics-0828 .review {margin-block:26px}
    #keigo-basics-0828 [hidden] {display:none}
  </style>
  <h2>敬語の基礎 — 確認テスト</h2>
  <div class="viz-row"><span>オリジナル問題・全8問</span><span>制限時間 10分</span><span id="kg-clock" class="tabular-nums">00:00</span></div>
  <section id="kg-intro" class="space"><p>最も適切な答えを一つ選んでください。解説は採点後に表示されます。</p><button class="btn btn-primary" type="button" id="kg-start">開始する</button></section>
  <section id="kg-exam" class="space" hidden>
    <div class="viz-row"><span id="kg-position"></span><span id="kg-count"></span></div>
    <p id="kg-context"></p><h3 id="kg-question"></h3>
    <form id="kg-choices" class="choices" aria-label="選択肢"></form>
    <div class="viz-controls"><button class="btn" type="button" id="kg-prev">前の問題</button><button class="btn" type="button" id="kg-next">次の問題</button><button class="btn btn-primary" type="button" id="kg-submit">解答を提出する</button></div>
    <div id="kg-confirm" class="space" hidden><p id="kg-confirm-text"></p><div class="viz-controls"><button class="btn btn-primary" type="button" id="kg-finish">提出して採点する</button><button class="btn" type="button" id="kg-cancel">戻る</button></div></div>
  </section>
  <section id="kg-result" class="space" aria-live="polite" hidden></section>
</div>
<script>
(() => {
  const root=document.getElementById('keigo-basics-0828');
  const $=id=>root.querySelector('#kg-'+id);
  const questions=[
    {id:'keigo-01',group:'존경어',sub:'상대의 말하기',context:'学生が、先生の発言について話しています。',q:'先生は「明日は休みです」と（　）。',choices:['申しました','拝見しました','おっしゃいました','いただきました'],answer:2,
      translation:'학생이 선생님의 발언에 대해 이야기합니다. 선생님은 “내일은 쉽니다”라고 말씀하셨습니다.',completed:'先生は「明日は休みです」とおっしゃいました。',rule:'言う의 존경어는 おっしゃる입니다. 주어인 선생님의 행동을 높입니다. 인용문＋と＋おっしゃる.',trap:'申す는 자신의 말을 낮추는 표현이라 높여야 할 선생님의 발언에 쓰지 않습니다. 拝見する는 보다, いただく는 받다·먹다·마시다와 관련됩니다.',difference:'先生がおっしゃる: 선생님이 말씀하시다. 私が申す: 제가 말하다. 말하는 사람이 누구인지 먼저 확인하세요.',example:'先生は何とおっしゃいましたか。 → 선생님은 뭐라고 말씀하셨나요?'},
    {id:'keigo-02',group:'겸양어',sub:'내가 상대 자료 보기',context:'あなたが、先生から送られた資料を見て、先生に報告します。',q:'先生、送ってくださった資料を（　）。',choices:['拝見しました','ご覧になりました','召し上がりました','おっしゃいました'],answer:0,
      translation:'선생님이 보내 준 자료를 내가 보고 선생님께 보고합니다. “선생님, 보내 주신 자료를 보았습니다.”',completed:'先生、送ってくださった資料を拝見しました。',rule:'見る의 겸양어는 拝見する입니다. 자료를 본 주체는 나이므로 나의 행동을 낮춰 선생님을 높입니다. 資料を＋拝見する.',trap:'문장 맨 앞 先生는 부르는 말입니다. 자료를 본 주어가 선생님이라는 뜻이 아닙니다. ご覧になる를 고르면 자기 행동에 존경어를 붙이게 됩니다.',difference:'先生が資料をご覧になる와 私が先生の資料を拝見する를 구분합니다. 눈에 보이는 인물명보다 실제 행동의 주체가 중요합니다.',example:'先生のお手紙を拝見しました。 → 선생님의 편지를 읽어 보았습니다.'},
    {id:'keigo-03',group:'존경어',sub:'상대의 먹기',context:'先生の食事について、尊敬語を使って話します。',q:'先生は昼ご飯にお寿司を（　）。',choices:['いただきました','拝見しました','申しました','召し上がりました'],answer:3,
      translation:'선생님의 식사에 대해 존경어로 말합니다. 선생님은 점심으로 초밥을 드셨습니다.',completed:'先生は昼ご飯にお寿司を召し上がりました。',rule:'食べる・飲む의 존경어는 召し上がる입니다. お寿司を＋召し上がる. 여기서는 음식과 식사 상황이 먹기라는 의미를 확정합니다.',trap:'いただく도 공손한 표현이지만 자신의 먹기·마시기에 쓰는 겸양어입니다. 단순히 더 공손해 보이는 말을 고르지 말고 주어를 확인하세요.',difference:'先生が召し上がる: 선생님이 드시다. 私がいただく: 제가 먹다·마시다. 같은 식사라도 높이는 방향이 다릅니다.',example:'先生はお茶を召し上がりました。 → 선생님은 차를 드셨습니다.'},
    {id:'keigo-04',group:'겸양어',sub:'내가 상대 방문하기',context:'あなたが、取引先の会社を訪問する予定を相手に伝えます。',q:'明日の午後三時に、私が御社へ（　）。',choices:['いらっしゃいます','伺います','おっしゃいます','ご覧になります'],answer:1,
      translation:'내가 거래처 회사를 방문할 예정임을 상대에게 전합니다. 내일 오후 3시에 제가 귀사를 방문하겠습니다.',completed:'明日の午後三時に、私が御社へ伺います。',rule:'상대를 방문하는 行く・訪ねる의 겸양 표현은 伺う입니다. 訪問先へ／に＋伺う. 주어 私가 명시되어 있습니다.',trap:'いらっしゃる는 상대의 가기·오기·있기를 높이는 존경어라 私의 방문에 쓰지 않습니다.',difference:'伺う는 방문 상대를 높이는 말입니다. 参る는 자신이 가거나 오는 일을 공손하게 말할 때 쓰며, 방문 상대를 높인다는 의미가 항상 있는 것은 아닙니다.',example:'明日、先生のお宅に伺います。 → 내일 선생님 댁에 찾아뵙겠습니다.'},
    {id:'keigo-05',group:'겸양어',sub:'자기소개·이름 말하기',context:'あなたが、初対面の取引先の人に自己紹介します。',q:'初めまして。私は山田と（　）。',choices:['申します','おっしゃいます','ご覧になります','召し上がります'],answer:0,
      translation:'처음 만난 거래처 사람에게 자기소개합니다. 처음 뵙겠습니다. 저는 야마다라고 합니다.',completed:'初めまして。私は山田と申します。',rule:'이름＋と申します는 자신의 이름을 공손하게 말하는 자기소개 표현입니다. 言う→申す. 이 퀴즈의 넓은 분류에서는 겸양어로 묶습니다.',trap:'おっしゃる는 상대의 발언을 높이므로 자기소개에 私は～とおっしゃいます라고 하지 않습니다.',difference:'私は山田と言います도 정중한 자기소개입니다. 申します는 더욱 격식 있게 자신을 낮춰 말합니다. 세부 분류에서 申す는 丁重語(謙譲語Ⅱ)이며, です・ます를 뜻하는 丁寧語와 구분합니다.',example:'田中と申します。よろしくお願いいたします。 → 다나카라고 합니다. 잘 부탁드립니다.'},
    {id:'keigo-06',group:'정중어',sub:'높임의 기능 구별',context:'「です・ます」を使って、聞き手に丁寧に話す表現を選んでください。',q:'尊敬語や謙譲語の特別な動詞を使わず、丁寧語だけで表した文はどれですか。',choices:['先生がおっしゃいました。','私が資料を拝見しました。','私は明日、図書館へ行きます。','先生が召し上がりました。'],answer:2,
      translation:'특별한 존경어·겸양어 동사를 쓰지 않고 です・ます로 듣는 사람에게 정중하게 말한 문장을 고르세요. “저는 내일 도서관에 갑니다.”',completed:'私は明日、図書館へ行きます。',rule:'行きます는 行く에 정중한 ます를 붙인 형태입니다. 듣는 사람에게 공손하지만 특정 행동 주체를 높이는 특수 존경 동사는 아닙니다.',trap:'나머지 문장도 ました를 포함해 정중하지만, 동시에 おっしゃる・拝見する・召し上がる라는 존경·겸양 동사를 사용합니다. 질문은 丁寧語だけ입니다.',difference:'ます가 있다고 모두 존경어인 것은 아닙니다. おっしゃいます는 존경 동사＋정중 표현, 行きます는 일반 동사＋정중 표현입니다.',example:'今日は雨です。明日は出かけます。 → 오늘은 비가 옵니다. 내일은 외출합니다.'},
    {id:'keigo-07',group:'존경어',sub:'상대의 행동·する',context:'先生の習慣について、尊敬語を使って話します。',q:'先生は健康のために、毎朝運動を（　）。',choices:['申します','いたします','拝見します','なさいます'],answer:3,
      translation:'선생님의 습관에 대해 존경어로 말합니다. 선생님은 건강을 위해 매일 아침 운동을 하십니다.',completed:'先生は健康のために、毎朝運動をなさいます。',rule:'する의 존경어는 なさる, ます형은 なさいます입니다. 運動をする→運動をなさる.',trap:'いたす도 する의 공손한 표현이지만 자신의 행동을 낮춰 말할 때 사용합니다. 선생님의 운동을 높이는 문장에는 맞지 않습니다.',difference:'先生がなさる: 선생님이 하시다. 私がいたす: 제가 하다. なさる의 ます형을 なさります로 만들지 않도록 주의하세요.',example:'先生は週末、何をなさいますか。 → 선생님은 주말에 무엇을 하시나요?'},
    {id:'keigo-08',group:'존경·겸양 구별',sub:'같은 동사·다른 주체',context:'先生の行動には尊敬語、自分の行動には謙譲語を使います。AとBに入る組み合わせを選んでください。',q:'先生は私の写真を（A）。私は先生の写真を（B）。',choices:['A 拝見しました ／ B ご覧になりました','A ご覧になりました ／ B 拝見しました','A ご覧になりました ／ B ご覧になりました','A 拝見しました ／ B 拝見しました'],answer:1,
      translation:'선생님의 행동에는 존경어, 자신의 행동에는 겸양어를 씁니다. “선생님은 제 사진을 보셨습니다. 저는 선생님의 사진을 보았습니다.”',completed:'先生は私の写真をご覧になりました。私は先生の写真を拝見しました。',rule:'두 문장의 見る를 주어에 맞게 바꿉니다. A의 주어는 先生→ご覧になる, B의 주어는 私→拝見する입니다.',trap:'私の写真・先生の写真의 소유자에 끌리면 높이는 방향이 뒤집힙니다. 사진의 주인이 아니라 사진을 보는 사람이 기준입니다.',difference:'先生の写真는 선생님의 사진이라는 명사구입니다. 先生が写真を見る처럼 행동 주어를 나타내는 표현과 구분하세요.',example:'先生は私の作文をご覧になりました。私は先生の本を拝見しました。 → 선생님은 제 작문을 보셨고, 저는 선생님의 책을 보았습니다.'}
  ];
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt=ms=>{const n=Math.floor(ms/1000);return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;};
  const answers=questions.map(()=>null),dwell=questions.map(()=>0);
  let started=false,done=false,index=0,startAt=0,enteredAt=0,timer=null,confirmation=false;
  const now=()=>performance.now();
  function capture(){if(started&&!done){const t=now();dwell[index]+=t-enteredAt;enteredAt=t;}}
  function render(){
    const q=questions[index];$('position').textContent=`第${index+1}問 / ${questions.length}問`;$('count').textContent=`解答済み ${answers.filter(a=>a!==null).length} / 8`;
    $('context').textContent=q.context;$('question').textContent=q.q;
    $('choices').innerHTML=q.choices.concat('分からない').map((c,j)=>{const value=j===4?'unknown':String(j);return `<label class="form-check"><input class="form-check-input" type="radio" name="kg-answer" value="${value}" ${answers[index]===value?'checked':''}><span class="form-check-label">${j===4?'':j+1+'. '}${esc(c)}</span></label>`;}).join('');
    $('prev').disabled=index===0;$('next').disabled=index===7;$('confirm').hidden=true;confirmation=false;enteredAt=now();
  }
  $('start').onclick=()=>{if(started)return;started=true;startAt=now();enteredAt=startAt;$('intro').hidden=true;$('exam').hidden=false;render();timer=setInterval(()=>{if(done)return;const elapsed=now()-startAt;$('clock').textContent=fmt(Math.min(elapsed,600000));if(elapsed>=600000)finish(true);},250);};
  $('choices').onsubmit=e=>e.preventDefault();
  $('choices').onchange=e=>{if(!started||done||confirmation)return;answers[index]=e.target.value;$('count').textContent=`解答済み ${answers.filter(a=>a!==null).length} / 8`;};
  $('prev').onclick=()=>{if(done||confirmation||index===0)return;capture();index--;render();};
  $('next').onclick=()=>{if(done||confirmation||index===7)return;capture();index++;render();};
  $('submit').onclick=()=>{if(done)return;confirmation=true;$('confirm-text').textContent=`未回答 ${answers.filter(a=>a===null).length}問。提出すると採点され、解答を変更できなくなります。`;$('confirm').hidden=false;$('choices').querySelectorAll('input').forEach(i=>i.disabled=true);$('prev').disabled=true;$('next').disabled=true;};
  $('cancel').onclick=()=>{capture();render();};
  $('finish').onclick=()=>finish(false);
  function finish(timedOut){
    if(!started||done)return;capture();done=true;clearInterval(timer);const elapsed=Math.min(now()-startAt,600000);$('clock').textContent=fmt(elapsed);$('exam').hidden=true;
    const wrong=[],unknown=[],unanswered=[],groups={};let correct=0;
    const attempts=questions.map((q,i)=>{
      const a=answers[i],state=a===null?'unanswered':a==='unknown'?'unknown':Number(a)===q.answer?'correct':'wrong';
      groups[q.group]??={correct:0,total:0};groups[q.group].total++;
      if(state==='correct'){correct++;groups[q.group].correct++;}else({wrong,unknown,unanswered}[state]).push(i+1);
      return{item_no:i+1,question_id:q.id,item_type_id:'grammar_form',category:['문법','문법형식 판단','경어',q.group,q.sub],question:q.q,context:q.context,choices:q.choices,selected_index:a===null||a==='unknown'?null:Number(a),selected_text:a===null?null:a==='unknown'?'分からない':q.choices[Number(a)],correct_index:q.answer,correct_text:q.choices[q.answer],response_state:state,response_seconds:Math.round(dwell[i]/1000)};
    });
    const date=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
    const reviewDates=[1,3,7].map(n=>{const d=new Date(date+'T12:00:00+09:00');d.setUTCDate(d.getUTCDate()+n);return{interval:'D+'+n,date:new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)};});
    const payload={test_id:'keigo-basics-check-20260828',test_date:date,title:'경어 기초 선택형 확인 8문항',source_class:'self_made',target_level:'N3 기반·경어 입문',memory_timing:'same_day_recognition',total_items:8,correct_items:correct,unknown_items:unknown.length,unanswered_items:unanswered.length,elapsed_seconds:Math.round(elapsed/1000),time_limit_seconds:600,timed_out:timedOut,groups,wrong,unknown,unanswered,attempts,review_dates:reviewDates,timing_note:'시작 버튼부터 제출까지 경과시간. 문항별 시간은 해당 문항 화면 체류시간을 재방문 포함 합산한 값으로 순수 사고시간이 아님. 반올림 때문에 합계가 전체 시간과 다를 수 있음.'};
    const out=$('result');out.hidden=false;out.lang='ko';
    out.innerHTML=`<h3>${correct}/8 · ${correct/8*100}% · ${fmt(elapsed)}</h3><p>자체 제작 경어 기초 확인${timedOut?' · 시간 종료로 자동 제출':''}</p><p>오답: ${wrong.join(', ')||'없음'} / 모름: ${unknown.join(', ')||'없음'} / 미응답: ${unanswered.join(', ')||'없음'}</p><div class="table-responsive"><table class="table"><thead><tr><th>세부 유형</th><th>정답</th><th>정답률</th></tr></thead><tbody>${Object.entries(groups).map(([k,v])=>`<tr><th>${esc(k)}</th><td>${v.correct}/${v.total}</td><td>${Math.round(v.correct/v.total*100)}%</td></tr>`).join('')}</tbody></table></div><div class="viz-controls"><button class="btn btn-primary" type="button" id="kg-record">結果を記録する</button></div><p id="kg-record-status" role="status">아직 학습 결과를 저장하지 않았습니다.</p><div id="kg-manual" hidden><label class="form-label" for="kg-payload">전송할 결과</label><textarea class="form-control" id="kg-payload" rows="8" readonly></textarea></div>`;
    questions.forEach((q,i)=>{const a=attempts[i],s=document.createElement('section');s.className='review';
      s.innerHTML=`<h3>${i+1}. ${{correct:'정답',wrong:'오답',unknown:'分からない',unanswered:'미응답'}[a.response_state]}</h3><p><strong>카테고리: 문법 → 문법형식 판단 → 경어 → ${esc(q.group)} · ${esc(q.sub)}</strong></p><p lang="ja">${esc(q.context)}<br>${esc(q.q)}</p><ol lang="ja">${q.choices.map(c=>`<li>${esc(c)}</li>`).join('')}</ol><p><strong>번역</strong><br>${esc(q.translation)}</p><p><strong>내 선택</strong>: ${esc(a.selected_text??'미응답')}<br><strong>정답</strong>: ${q.answer+1}. ${esc(a.correct_text)}<br><span lang="ja">${esc(q.completed)}</span></p><p><strong>접속·의미</strong><br>${esc(q.rule)}</p><p><strong>함정</strong><br>${esc(q.trap)}</p><p><strong>유사 표현 차이</strong><br>${esc(q.difference)}</p><p><strong>추가 예문</strong><br>${esc(q.example)}</p><p><strong>다음 복습</strong><br>${['wrong','unknown'].includes(a.response_state)?reviewDates.map(d=>d.interval+' '+d.date).join(' · ')+' — 결과 기록 후 등록':a.response_state==='unanswered'?'미응답 사유 확인 후 일정 결정':'이번 정답만으로 숙달 완료를 판정하지 않음'}</p><p>문항 화면 체류시간: ${a.response_seconds}초</p>`;out.appendChild(s);});
    const prompt='경어 기초 확인시험 실제 결과를 DB·학습 기록·오답노트에 반영하고 분석해줘. 자체 제작 당일 확인시험으로 공식 시험과 구분하고 합격 확률로 직접 환산하지 마. 모든 문항의 원문·선택지·정답과 선택한 답을 보존해줘. 해설에는 영역→문제 유형→세부 유형을 표시하고 오답·모름은 D+1·D+3·D+7에 등록해줘.\n'+JSON.stringify(payload,null,2);
    $('record').onclick=async()=>{const b=$('record');b.disabled=true;try{if(typeof window.openai?.sendFollowUpMessage!=='function')throw Error('unavailable');await window.openai.sendFollowUpMessage({prompt,title:'경어 확인 결과를 기록할까요?'});$('record-status').textContent='전송을 요청했습니다. 채팅에서 저장 완료 여부를 확인하세요.';b.disabled=false;}catch(e){$('record-status').textContent='자동 전송을 완료하지 못했습니다. 아래 결과를 복사해 채팅에 붙여 주세요.';$('manual').hidden=false;$('payload').value=prompt;b.disabled=false;}};
  }
})();
</script>
