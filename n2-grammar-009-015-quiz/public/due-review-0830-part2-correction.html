<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>期限復習 第2回 即時訂正</title>
<style>:root{font-family:"Yu Gothic UI","Meiryo",sans-serif;font-size:19px;color:#182034;background:#edf1f7}*{box-sizing:border-box}body{margin:0}.wrap{width:min(920px,calc(100% - 28px));margin:28px auto}.panel{background:#fff;border:1px solid #d6ddea;border-radius:18px;padding:34px;box-shadow:0 12px 32px #20304d16}h1{font-size:2rem}h2{font-size:1.45rem}h3{font-size:1.3rem;line-height:1.7;white-space:pre-wrap}.muted{color:#65718a}.top{display:flex;justify-content:space-between;gap:18px;align-items:center}.timer{font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums}.badges{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.badge{padding:7px 13px;border-radius:99px;background:#e6ecff;color:#30479c;font-weight:800}.progress{height:10px;background:#dfe4ec;border-radius:99px;overflow:hidden;margin:18px 0 28px}.bar{height:100%;background:#3458d5}.options{display:grid;gap:12px;margin:24px 0}button{font:inherit;border:1px solid #c7d0e1;border-radius:12px;background:#fff;color:#182034;padding:15px 18px;cursor:pointer}button:hover{background:#f3f6ff;border-color:#4a68d4}.option{text-align:left;min-height:60px}.option.selected{background:#e5ecff;border:3px solid #3458d5;padding:13px 16px}.primary{background:#3458d5;color:#fff;border-color:#3458d5;font-weight:800}.primary:hover{background:#294abd}.block{width:100%}.nav{display:flex;justify-content:space-between;gap:12px}.nav button{min-width:160px}.listen{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0}.result{border-top:1px solid #dce2ec;padding:22px 0}.wrong h3{color:#a02a20}.script{white-space:pre-wrap;background:#f3f5f9;border-radius:12px;padding:14px}.error{color:#b42318;font-weight:800}[hidden]{display:none!important}@media(max-width:600px){:root{font-size:17px}.panel{padding:21px}.nav button{min-width:0;flex:1}}</style></head>
<body><main class="wrap">
<section id="start" class="panel"><p class="muted">説明直後の訂正練習</p><h1>弱点訂正　3問</h1><div class="badges"><span class="badge">聴解 1問</span><span class="badge">文法 2問</span><span class="badge">5分</span></div><button id="startBtn" class="primary block">開始する</button></section>
<section id="quiz" class="panel" hidden><div class="top"><div><p id="kind" class="muted"></p><h2 id="count"></h2></div><div id="timer" class="timer">00:00</div></div><div class="progress"><div id="bar" class="bar"></div></div><h3 id="question"></h3><div id="listen" class="listen" hidden><button id="playBtn">▶ 音声を再生</button><span id="playInfo" class="muted"></span></div><div id="options" class="options"></div><p id="error" class="error" hidden>答えか「分からない」を選んでください。</p><div class="nav"><button id="prev">前へ</button><button id="next" class="primary">次へ</button></div></section>
<section id="results" class="panel" hidden><h1>結果　<span id="score"></span></h1><p id="time" class="muted"></p><div id="review"></div><button id="copy" class="primary block">結果をコピーする</button><p id="status" class="muted"></p></section>
</main><script>
const items=[
 {no:1,id:'correction-first-action',itemType:'listening_task',type:'課題理解',category:'청해 → 과제이해(課題理解) → 첫 행동·후속 지불',question:'女の人は、この後まず何をしますか。',choices:['申込書を受け取る','参加費を払う','二階の会場へ行く','係の人に電話する'],correct:'申込書を受け取る',audio:'男：セミナーに参加する方は、まず受付で申込書を受け取ってください。女：参加費はここで払いますか。男：いいえ。申込書を書いてから、二階の会場で払ってください。女：分かりました。',translation:'여자는 이 뒤 먼저 무엇을 합니까?',rule:'まず의 행동이 첫 단계이며, 〜てから 뒤의 지불은 후속 행동입니다.',trap:'대화 뒤쪽의 참가비 지불을 첫 행동으로 선택하지 않습니다.',procedure:'질문의 まず 표시 → 행동을 순서대로 정리 → 아직 하지 않은 첫 행동 선택.',check:'마지막 행동이 아니라 가장 먼저 해야 하는 행동인가?'},
 {no:2,id:'correction-na-present-negative',itemType:'adjective_conjugation',type:'文の文法1',category:'문법 → 문법형식 판단 → な형용사 현재 부정',question:'この町は便利ですが、夜はあまり静か（　）。',choices:['ではありません','ではありませんでした','くありません','かったです'],correct:'ではありません',translation:'이 동네는 편리하지만 밤에는 별로 조용하지 않습니다.',rule:'な형용사 현재 부정은 어간＋ではありません입니다.',trap:'夜は는 반복되는 현재 상태이며 과거 단서가 없습니다.',procedure:'静かだ로 복원 → な형용사 확인 → 시제 단서 확인 → 현재 부정 선택.',check:'과거를 나타내는 말이 있는가?'},
 {no:3,id:'correction-aida',itemType:'grammar_form',type:'文の文法1',category:'문법 → 문법형식 판단 → 間／間に',question:'電車を待っている（　）、ずっと本を読んでいました。',choices:['間','間に','までに','たびに'],correct:'間',translation:'전철을 기다리는 동안 계속 책을 읽고 있었습니다.',rule:'기준 기간과 주절 행동이 계속 겹치면 間를 씁니다.',trap:'ずっと＋読んでいました는 한 시점의 사건이 아니라 전체 기간의 지속입니다.',procedure:'ずっと·진행형 확인 → 기간 전체 지속이면 間 → 한 번 발생·완료면 間に.',check:'주절 행동이 기간 내내 이어지는가?'}
];
const $=x=>document.getElementById(x);let i=0,elapsed=0,tick,current=0,startedAt;const rs=items.map(()=>({selected:null,seconds:0,visited:false,playCount:0,audioError:false}));
const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;function save(){if(current)rs[i].seconds+=Math.max(0,Math.round((Date.now()-current)/1000));current=0}
function render(){const x=items[i],r=rs[i];$('kind').textContent=x.type;$('count').textContent=`問題 ${i+1} / 3`;$('bar').style.width=`${(i+1)/3*100}%`;$('question').textContent=x.question;$('listen').hidden=!x.audio;$('playInfo').textContent=x.audio?`再生 ${r.playCount} / 2`:'';$('playBtn').disabled=!x.audio||r.playCount>=2;$('options').innerHTML=[...x.choices,'分からない'].map((v,n)=>`<button class="option ${r.selected===v?'selected':''}" data-n="${n}">${n<4?n+1:'?'}　${v}</button>`).join('');[...$('options').children].forEach((b,n)=>b.onclick=()=>{r.selected=n<4?x.choices[n]:'分からない';r.visited=true;render()});$('prev').disabled=i===0;$('next').textContent=i===2?'提出する':'次へ';$('error').hidden=true;current=Date.now()}
function play(){const x=items[i],r=rs[i];if(!x.audio||r.playCount>=2)return;speechSynthesis.cancel();const lines=[...x.audio.matchAll(/(男|女)：([\s\S]*?)(?=(?:男|女)：|$)/g)].map(m=>({speaker:m[1],text:m[2].trim()}));const voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('ja'));let n=0;r.playCount++;$('playInfo').textContent=`再生 ${r.playCount} / 2`;function speakNext(){if(n>=lines.length)return;const line=lines[n++],u=new SpeechSynthesisUtterance(line.text);u.lang='ja-JP';u.rate=.9;if(voices.length)u.voice=voices[line.speaker==='男'?0:Math.min(1,voices.length-1)];u.onend=speakNext;u.onerror=()=>{r.audioError=true;$('playInfo').textContent='音声エラー'};speechSynthesis.speak(u)}speakNext();if(r.playCount>=2)$('playBtn').disabled=true}
function start(){startedAt=new Date().toISOString();$('start').hidden=true;$('quiz').hidden=false;tick=setInterval(()=>{$('timer').textContent=fmt(++elapsed);if(elapsed>=300)submit()},1000);render()}
function next(){if(!rs[i].selected){$('error').hidden=false;return}save();if(i===2){submit();return}i++;render()}
function submit(){if(!$('results').hidden)return;save();clearInterval(tick);speechSynthesis.cancel();$('quiz').hidden=true;$('results').hidden=false;const a=items.map((x,n)=>{const r=rs[n],state=x.audio&&r.audioError?'audio_error':!r.selected?'unanswered':r.selected==='分からない'?'unknown':r.selected===x.correct?'correct':'wrong';return {...x,...r,state}}),correct=a.filter(x=>x.state==='correct').length;$('score').textContent=`${correct} / 3`;$('time').textContent=`時間 ${fmt(elapsed)}`;const order={wrong:0,unknown:1,audio_error:2,unanswered:3,correct:4};$('review').innerHTML=a.sort((x,y)=>order[x.state]-order[y.state]).map(x=>`<article class="result ${x.state}"><p class="muted">${x.state==='correct'?'正解':x.state==='wrong'?'오답':x.state==='unknown'?'모름':x.state==='audio_error'?'음성 오류':'미응답'} · ${x.category}</p><h3>${x.question}</h3><p><strong>${x.selected||'미응답'} → ${x.correct}</strong></p>${x.audio?`<p class="script">${x.audio}</p>`:''}<p><strong>번역</strong> ${x.translation}</p><p><strong>접속·의미</strong> ${x.rule}</p><p><strong>함정</strong> ${x.trap}</p><p><strong>풀이 절차</strong> ${x.procedure}</p><p><strong>정답 직전 체크</strong> ${x.check}</p></article>`).join('');window.result={test_id:'due-review-20260830-part2-correction-3',test_date:'2026-08-30',title:'만기 복습 2차 오답 즉시 교정 3문항',source_class:'자체 제작 학습용',target_level:'N3 기반',memory_timing:'오답 해설 직후 교정',total_items:3,correct_items:correct,unknown_items:a.filter(x=>x.state==='unknown').length,unanswered_items:a.filter(x=>x.state==='unanswered').length,elapsed_seconds:elapsed,time_limit_seconds:300,timed_out:elapsed>=300,started_at:startedAt,attempts:a.map(x=>({item_no:x.no,question_id:x.id,item_type_id:x.itemType,is_official_type:true,type:x.type,category:x.category,state:x.state,question:x.question,choices:x.choices,selected_text:x.selected,correct_text:x.correct,response_seconds:x.seconds,play_count:x.audio?x.playCount:null,audio_error:x.audio?x.audioError:false,visited:x.visited})),practice_note:'만기 복습 2차 오답 해설 직후 선택형 교정. 공식 시험·D+1 유지율·기존 점수 및 만기 완료 상태와 분리.'}}
$('startBtn').onclick=start;$('playBtn').onclick=play;$('prev').onclick=()=>{save();i=Math.max(0,i-1);render()};$('next').onclick=next;$('copy').onclick=async()=>{const text=`다음 만기 복습 2차 오답 즉시 교정의 실제 결과를 기록하고 오답과 모름부터 설명해줘. 공식 시험·D+1 유지율·기존 점수·기존 만기 완료 상태와 분리하고 타이머만 중복 없이 가산해줘. 정상 응답의 오답·모름만 새 D+1·D+3·D+7로 등록하고 기존 일정은 보존해줘.\n${JSON.stringify(window.result,null,2)}`;await navigator.clipboard.writeText(text);$('status').textContent='결과를 복사했습니다. 채팅에 붙여 넣어 주세요.'};
</script></body></html>
