const $=id=>document.getElementById(id);let index=0,startedAt=null,elapsed=0,tick=null,currentStart=0;
const responses=items.map(()=>({selected:null,seconds:0,visited:false,playCount:0,audioError:false}));

function select(value){responses[index].selected=value;responses[index].visited=true;render()}
function render(){const x=items[index],r=responses[index];$('meta').textContent=`${x.type} · ${x.interval}`;$('count').textContent=`問題 ${index+1} / ${items.length}`;$('question').textContent=x.question;$('bar').style.width=`${(index+1)/items.length*100}%`;$('bar').parentElement.setAttribute('aria-valuenow',index+1);$('listen').hidden=!x.audio;$('playInfo').textContent=x.audio?`再生 ${r.playCount} / 2`:'';$('playBtn').disabled=!x.audio||r.playCount>=2;$('options').innerHTML=[...x.choices,'分からない'].map((v,i)=>`<button class="option ${r.selected===v?'selected':''}" aria-pressed="${r.selected===v}" data-i="${i}">${i<4?i+1:'?'}　${v}</button>`).join('');[...$('options').children].forEach((b,i)=>b.onclick=()=>select(i<4?x.choices[i]:'分からない'));$('prevBtn').disabled=index===0;$('nextBtn').textContent=index===items.length-1?'提出する':'次へ';$('validation').hidden=true;currentStart=Date.now()}
function play(){const x=items[index],r=responses[index];if(!x.audio||r.playCount>=2)return;speechSynthesis.cancel();const lines=[...x.audio.matchAll(/(男|女)：([\s\S]*?)(?=(?:男|女)：|$)/g)].map(m=>({speaker:m[1],text:m[2].trim()}));const voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('ja'));let n=0;r.playCount++;$('playInfo').textContent=`再生 ${r.playCount} / 2`;function speakNext(){if(n>=lines.length)return;const line=lines[n++],u=new SpeechSynthesisUtterance(line.text);u.lang='ja-JP';u.rate=.9;if(voices.length)u.voice=voices[line.speaker==='男'?0:Math.min(1,voices.length-1)];u.onend=speakNext;u.onerror=()=>{r.audioError=true;$('playInfo').textContent='音声エラー'};speechSynthesis.speak(u)}speakNext();$('playBtn').disabled=r.playCount>=2}
function start(){startedAt=new Date().toISOString();$('start').hidden=true;$('quiz').hidden=false;tick=setInterval(()=>{$('timer').textContent=fmt(++elapsed);if(elapsed>=1080)submit()},1000);render()}
function move(delta){if(!$('validation').hidden)return;if(delta>0&&!responses[index].selected){$('validation').hidden=false;return}saveTime();if(index===items.length-1&&delta>0){submit();return}index=Math.max(0,Math.min(items.length-1,index+delta));render()}
function submit(){if(!$('results').hidden)return;saveTime();clearInterval(tick);speechSynthesis.cancel();$('quiz').hidden=true;$('results').hidden=false;const attempts=items.map((x,i)=>{const r=responses[i];const accepted=x.accepted||[x.correct];const state=x.audio&&r.audioError?'audio_error':!r.selected?'unanswered':r.selected==='分からない'?'unknown':accepted.includes(r.selected)?'correct':'wrong';return {...x,...r,state}});const valid=attempts.filter(x=>x.state!=='audio_error'&&x.state!=='unanswered'),correct=valid.filter(x=>x.state==='correct').length,needs=attempts.filter(x=>x.state==='wrong'||x.state==='unknown').length;$('score').textContent=`${correct} / ${valid.length}`;$('elapsed').textContent=fmt(elapsed);$('needs').textContent=`${needs}問`;const order={wrong:0,unknown:1,audio_error:2,unanswered:3,correct:4};$('reviews').innerHTML=attempts.sort((a,b)=>order[a.state]-order[b.state]).map(x=>`<article class="review ${x.state}"><p class="muted">${x.state==='correct'?'正解':x.state==='wrong'?'오답':x.state==='unknown'?'모름':x.state==='audio_error'?'음성 오류':'미응답'} · ${x.category}</p><h3>${x.question}</h3><p class="answer">${x.selected||'미응답'} → ${x.correct}</p>${x.audio?`<p class="script"><strong>대본</strong>\n${x.audio}</p>`:''}<p><strong>번역</strong> ${x.translation}</p><p><strong>접속·의미</strong> ${x.rule}</p><p><strong>함정</strong> ${x.trap}</p><p><strong>유사 문형·표현</strong> ${x.similar}</p><p><strong>예문</strong> ${x.example}</p><p><strong>다음 복습일</strong> D+1 2026-08-31 · D+3 2026-09-02 · D+7 2026-09-06</p></article>`).join('');const groups={};attempts.forEach(x=>{groups[x.type]??={correct:0,total:0,excluded:0};groups[x.type].total++;if(x.state==='correct')groups[x.type].correct++;if(x.state==='audio_error'||x.state==='unanswered')groups[x.type].excluded++});window.resultPayload={test_id:'due-review-20260830-part2-13',test_date:'2026-08-30',due_date:'2026-08-30',title:'만기 복습 2차 — 청해·형용사·문법 13문항',source_class:'자체 제작',target_level:'N3 기반',memory_timing:'D+3 12문항·D+1 1문항 변형 재시험',total_items:13,correct_items:attempts.filter(x=>x.state==='correct').length,unknown_items:attempts.filter(x=>x.state==='unknown').length,unanswered_items:attempts.filter(x=>x.state==='unanswered').length,valid_items:valid.length,valid_correct_items:correct,excluded_items:attempts.filter(x=>x.state==='audio_error'||x.state==='unanswered').map(x=>x.no),elapsed_seconds:elapsed,time_limit_seconds:1080,timed_out:elapsed>=1080,started_at:startedAt,groups,attempts:attempts.map(x=>({item_no:x.no,review_queue_id:x.queue,source_attempt_id:x.source,due_interval:x.interval,item_type_id:x.itemType,is_official_type:true,type:x.type,category:x.category,state:x.state,question:x.question,choices:x.choices,selected_text:x.selected,correct_text:x.correct,response_seconds:x.seconds,audio_seconds:null,decision_seconds:null,play_count:x.audio?x.playCount:null,audio_error:x.audio?x.audioError:false,visited:x.visited,original_unavailable:x.originalUnavailable||false})),review_dates:[{interval:'D+1',date:'2026-08-31'},{interval:'D+3',date:'2026-09-02'},{interval:'D+7',date:'2026-09-06'}],mapping_note:'2026-08-30 남은 만기 queue 13건과 source_attempt_id·due_interval을 1대1 연결한 변형 문제. D+3 12건·D+1 1건. 원문이 없는 청해 1·2번은 동일 유형의 새 변형 문항이며 동일 원문 재시험이 아님. 10번은 문맥상 ことにしました와 ようになりました가 모두 가능하여 둘 다 정답 인정.',timing_note:'開始する부터 제출까지 타이머. 문항 시간은 화면 체류시간이며 순수 사고시간이 아님. 음성 오류·미응답·중단은 만기 완료 판정에서 제외.'}}
$('startBtn').onclick=start;$('playBtn').onclick=play;$('prevBtn').onclick=()=>{saveTime();index=Math.max(0,index-1);render()};$('nextBtn').onclick=()=>move(1);$('copyBtn').onclick=async()=>{const text=`다음 만기 복습 2차의 실제 결과를 DB·학습 로그·오답노트에 중복 없이 기록해줘. review_queue_id·source_attempt_id·due_interval을 대조하고 정상 제출 항목만 완료 처리해줘. 미응답·음성 오류·중단은 완료 처리하지 말고, 오답과 分からない만 새 D+1·D+3·D+7로 등록하며 기존 일정·점수는 보존해줘. D+3 12문항과 D+1 1문항을 분리 집계하고 공식 시험과 분리해줘. 원문이 없는 청해 1·2번은 동일 유형 변형 문항임을 명시해줘. 타이머만 가산하고 오답과 모름부터 원문·번역·정답·접속·함정·유사 문형·예문·복습일·풀이 절차를 설명해줘.\n${JSON.stringify(window.resultPayload,null,2)}`;await navigator.clipboard.writeText(text);$('copyStatus').textContent='결과를 복사했습니다. 채팅에 붙여 넣어 주세요.'};
