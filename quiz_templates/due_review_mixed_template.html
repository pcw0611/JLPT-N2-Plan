<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>期限復習・第2ブロック</title></head><body>
<div id="__ROOT_ID__" lang="ja">
<style>
#__ROOT_ID__{color:var(--foreground,#202124);font:16px/1.65 system-ui,sans-serif;max-width:820px;margin:auto;padding:24px}#__ROOT_ID__ [hidden]{display:none}#__ROOT_ID__ .section{margin-block:18px}#__ROOT_ID__ .choices{display:grid;gap:12px;margin-block:20px}#__ROOT_ID__ .question{white-space:pre-line}#__ROOT_ID__ .review{margin-block:28px;padding-block:16px;border-top:1px solid #ddd}#__ROOT_ID__ .script{white-space:pre-wrap;background:#f6f7f8;padding:14px;border-radius:10px}#__ROOT_ID__ .viz-row,#__ROOT_ID__ .viz-controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}#__ROOT_ID__ .viz-row{justify-content:space-between}#__ROOT_ID__ .btn{border:1px solid #aaa;background:#fff;border-radius:9px;padding:10px 16px;cursor:pointer}#__ROOT_ID__ .btn-primary{background:#2563eb;color:#fff;border-color:#2563eb}#__ROOT_ID__ .btn:disabled{opacity:.45;cursor:not-allowed}#__ROOT_ID__ .form-check{display:flex;gap:10px;align-items:flex-start;border:1px solid #ddd;border-radius:10px;padding:12px}#__ROOT_ID__ input{margin-top:6px}
</style>
<h2>期限復習・第2ブロック</h2>
<div class="viz-row"><span>全__COUNT__問・制限24分</span><span>D+3 8問・D+1 8問</span><span id="clock" class="tabular-nums">00:00</span></div>
<section id="intro" class="section"><p>語彙・読解5問、聴解11問。聴解は各問2回までです。分からない場合は「分からない」を選んでください。</p><div class="viz-controls"><button class="btn" id="sound" type="button">音声を確認する</button><button class="btn btn-primary" id="start" type="button" disabled>開始する</button></div><p id="voice-status" role="status">日本語の音声を確認してください。</p><label class="form-check"><input class="form-check-input" id="heard" type="checkbox" disabled><span class="form-check-label">日本語の音声が聞こえました</span></label></section>
<section id="exam" class="section" hidden><div class="viz-row"><span id="position"></span><span id="kind"></span><span id="plays"></span></div><h3 id="question" class="question"></h3><div class="viz-controls"><button class="btn btn-primary" id="play" type="button">音声を再生する</button></div><p id="audio-status" role="status"></p><form id="choices" class="choices"></form><div class="viz-controls"><button class="btn btn-primary" id="next" type="button">次の問題へ</button><button class="btn" id="submit" type="button">解答を提出する</button></div><section id="confirm" class="section" hidden><p id="confirm-text"></p><div class="viz-controls"><button class="btn btn-primary" id="confirm-submit" type="button">提出して採点する</button><button class="btn" id="cancel-submit" type="button">戻る</button></div></section></section>
<section id="result" class="section" aria-live="polite" hidden></section>
</div>
<script>(()=>{
const root=document.getElementById('__ROOT_ID__'),$=id=>root.querySelector('#'+id),data=__DATA__,limit=__LIMIT_SECONDS__*1000,synth=window.speechSynthesis;
const rows=data.map(()=>({selected:null,plays:0,audioMs:0,decisionMs:null,totalMs:0,lastAudioEnd:null,audioError:false}));let voices=[],active=false,done=false,index=0,startedAt=0,enteredAt=0,timer,busy=false,token=0,confirming=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=ms=>{const n=Math.floor(ms/1000);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};
function loadVoices(){voices=synth?synth.getVoices().filter(v=>/^ja(?:[-_]|$)/i.test(v.lang)):[];return voices.length>0}function voice(r){return voices[r==='m'&&voices.length>1?1:0]}
function stop(){token++;if(synth)synth.cancel();busy=false}function speak(lines,ok,fail){stop();const mine=token;busy=true;let i=0;function step(){if(mine!==token)return;if(i===lines.length){busy=false;ok();return}const [role,text]=lines[i++],u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.voice=voice(role);u.rate=.9;u.pitch=voices.length>1?1:(role==='m'?.87:role==='f'?1.12:1);u.onend=step;u.onerror=()=>{if(mine===token){busy=false;fail()}};synth.speak(u)}step()}
$('sound').onclick=()=>{if(!loadVoices()){$('voice-status').textContent='日本語の音声が利用できません。チャットで知らせてください。';return}$('sound').disabled=true;speak([['n','音声の確認です。日本語が聞こえますか。']],()=>{$('voice-status').textContent='聞こえたらチェックしてください。';$('heard').disabled=false;$('sound').disabled=false},()=>{$('voice-status').textContent='音声エラーです。';$('sound').disabled=false})};if(synth){loadVoices();synth.addEventListener('voiceschanged',loadVoices)}$('heard').onchange=()=>{$('start').disabled=!$('heard').checked};
function render(){const x=data[index],r=rows[index],audio=!!x.s;enteredAt=performance.now();$('position').textContent=`第${index+1}問 / ${data.length}問`;$('kind').textContent=`${x.type}・${x.due_interval}${x.isOfficialType?'':'・学習用'}`;$('question').textContent=x.q;$('plays').textContent=audio?`再生 ${r.plays}/2`:'音声なし';$('play').hidden=!audio;$('play').disabled=!audio||r.plays>=2;$('audio-status').textContent=audio?'音声を再生してから答えてください。':'最もよいものを一つ選んでください。';$('choices').innerHTML=x.c.concat('分からない').map((v,j)=>`<label class="form-check"><input class="form-check-input" type="radio" name="answer" value="${j===4?'unknown':j}" ${audio&&r.plays===0?'disabled':''}><span class="form-check-label">${j===4?'':j+1+'. '}${esc(v)}</span></label>`).join('');$('next').textContent=index===data.length-1?'採点へ':'次の問題へ';$('confirm').hidden=true;confirming=false}
$('start').onclick=()=>{active=true;startedAt=performance.now();$('intro').hidden=true;$('exam').hidden=false;render();timer=setInterval(()=>{const e=performance.now()-startedAt;$('clock').textContent=fmt(e);if(e>=limit)finish(true)},250)};
$('play').onclick=()=>{if(busy||rows[index].plays>=2)return;const r=rows[index],beg=performance.now();r.plays++;$('plays').textContent=`再生 ${r.plays}/2`;$('play').disabled=true;$('next').disabled=true;$('submit').disabled=true;$('choices').querySelectorAll('input').forEach(e=>e.disabled=true);speak(data[index].s,()=>{r.audioMs+=performance.now()-beg;r.lastAudioEnd=performance.now();$('play').disabled=r.plays>=2;$('next').disabled=false;$('submit').disabled=false;$('audio-status').textContent='再生が終わりました。';$('choices').querySelectorAll('input').forEach(e=>e.disabled=false)},()=>{r.audioMs+=performance.now()-beg;r.audioError=true;$('audio-status').textContent='音声エラーです。無理に答えず提出してください。';$('next').disabled=false;$('submit').disabled=false})};
$('choices').onchange=e=>{const r=rows[index];r.selected=e.target.value;if(r.lastAudioEnd!==null)r.decisionMs=performance.now()-r.lastAudioEnd};$('choices').onsubmit=e=>e.preventDefault();function close(){const r=rows[index];r.totalMs+=performance.now()-enteredAt;if(r.selected!==null&&r.decisionMs===null&&r.lastAudioEnd!==null)r.decisionMs=performance.now()-r.lastAudioEnd}
function ask(){confirming=true;$('confirm-text').textContent=`未回答は${rows.filter(r=>r.selected===null).length}問です。提出しますか。`;$('confirm').hidden=false;$('next').disabled=true;$('play').disabled=true}$('next').onclick=()=>{if(confirming||busy)return;if(index===data.length-1){ask();return}if(rows[index].selected===null){$('audio-status').textContent='答えか「分からない」を選んでください。';return}close();index++;render()};$('submit').onclick=ask;$('cancel-submit').onclick=()=>{confirming=false;$('confirm').hidden=true;$('next').disabled=false;$('play').disabled=!data[index].s||rows[index].plays>=2};$('confirm-submit').onclick=()=>finish(false);
function finish(timedOut){if(done)return;close();done=true;active=false;clearInterval(timer);stop();const elapsed=Math.min(performance.now()-startedAt,limit),groups={},wrong=[],unknown=[],unanswered=[];let score=0,valid=0,validCorrect=0;const attempts=data.map((x,i)=>{const r=rows[i],state=r.selected===null?'unanswered':r.selected==='unknown'?'unknown':Number(r.selected)===x.a?'correct':'wrong',excluded=!!r.audioError;if(state==='correct')score++;if(!excluded&&state!=='unanswered'){valid++;if(state==='correct')validCorrect++}groups[x.type]??={correct:0,total:0,excluded:0};groups[x.type].total++;if(excluded)groups[x.type].excluded++;else if(state==='correct')groups[x.type].correct++;if(state!=='correct')({wrong,unknown,unanswered}[state]).push(i+1);return{item_no:i+1,review_queue_id:x.queue,source_attempt_id:x.source,due_interval:x.due_interval,item_type_id:x.itemType,is_official_type:x.isOfficialType,type:x.type,category:x.category,subtype:x.sub,state,question:x.q,choices:x.c,selected_text:r.selected===null?null:r.selected==='unknown'?'分からない':x.c[Number(r.selected)],correct_text:x.c[x.a],response_seconds:Math.round(r.totalMs/1000),audio_seconds:x.s?Math.round(r.audioMs/1000):null,decision_seconds:x.s&&r.decisionMs!==null?Math.round(r.decisionMs/1000):null,play_count:x.s?r.plays:null,audio_error:r.audioError,visited:true}});const date=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),rd=n=>{const d=new Date(date+'T12:00:00+09:00');d.setUTCDate(d.getUTCDate()+n);return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)};const payload={test_id:'__TEST_ID__',test_date:date,due_date:'2026-08-29',title:'만기 복습 2차 — 어휘·독해·청해 16문항',source_class:'자체 제작',target_level:'N3 기반·N2 입문',memory_timing:'D+3 8문항·D+1 8문항 변형 재시험',total_items:16,correct_items:score,unknown_items:unknown.length,unanswered_items:unanswered.length,valid_items:valid,valid_correct_items:validCorrect,elapsed_seconds:Math.round(elapsed/1000),time_limit_seconds:1440,timed_out:timedOut,groups,wrong,unknown,unanswered,attempts,review_dates:[1,3,7].map(n=>({interval:'D+'+n,date:rd(n)})),mapping_note:'2026-08-29 남은 만기 review_queue 16건과 source_attempt_id·due_interval을 1대1 연결한 변형 문제. D+3 8건·D+1 8건. 16번 표현 듣기는 학습용 비공식 유형.',timing_note:'開始する부터 제출까지 타이머. 청해는 재생시간과 마지막 재생 종료 후 선택시간을 별도 측정. 음성 오류·미응답·중단은 만기 완료 판정에서 제외.'};$('exam').hidden=true;const out=$('result');out.hidden=false;out.lang='ko';out.innerHTML=`<h3>${score}/16 · ${(score/16*100).toFixed(1)}% · ${fmt(elapsed)}</h3><p>오답 ${wrong.join(', ')||'없음'} · 分からない ${unknown.join(', ')||'없음'} · 미응답 ${unanswered.join(', ')||'없음'}</p><div class="viz-controls"><button class="btn btn-primary" id="record" type="button">結果を記録する</button></div><p id="record-status">아직 기록되지 않았습니다.</p>`;attempts.forEach((a,i)=>{const x=data[i],s=document.createElement('section');s.className='review';s.innerHTML=`<h3>${i+1}. ${{correct:'정답',wrong:'오답',unknown:'分からない',unanswered:'미응답'}[a.state]} — ${esc(x.sub)}</h3><p><strong>선택:</strong> ${esc(a.selected_text??'미응답')}<br><strong>정답:</strong> ${esc(a.correct_text)}</p>${x.s?`<div class="script" lang="ja">${x.s.map(([r,t])=>esc(({n:'案内',m:'男',f:'女'}[r])+': '+t)).join('<br>')}</div>`:''}<p><strong>번역·정답 근거</strong><br>${esc(x.ko)}</p><p><strong>접속·의미</strong><br>${esc(x.rule)}</p><p><strong>함정</strong><br>${esc(x.trap)}</p><p><strong>유사 표현·유형</strong><br>${esc(x.diff)}</p><p><strong>예문</strong><br>${esc(x.ex)}</p><p><strong>다음에는 이렇게 풀기</strong><br>${esc(x.procedure)}</p><p><strong>정답 직전 체크</strong><br>${esc(x.check)}</p>`;out.appendChild(s)});const prompt='다음 만기 복습 2차의 실제 제출 결과를 DB·학습 로그·오답노트에 중복 없이 기록해줘. review_queue_id와 source_attempt_id 및 due_interval을 대조하고, 정상 응답을 제출한 해당 만기 항목만 결과와 함께 완료 처리해줘. 미응답·음성 오류·중단 항목은 완료 처리하지 마. 오답과 分からない만 새 D+1·D+3·D+7로 등록하고 기존 이후 일정과 기존 점수·복습 상태를 보존해줘. D+3 8문항과 D+1 8문항을 분리 집계하고 공식 시험과 분리해줘. 16번 표현 듣기는 학습용 비공식 유형으로 분리해줘. 타이머 시간만 중복 없이 더하고 해설 읽기·다른 학습시간은 추정하지 마. 합격 확률로 직접 환산하지 마. 오답과 모름부터 원문·번역·정답·접속·함정·유사 문형·예문·다음 복습일·다음번 풀이 절차·정답 직전 체크를 포함해 설명해줘.\n'+JSON.stringify(payload,null,2);$('record').onclick=async()=>{const b=$('record');b.disabled=true;try{if(typeof window.openai?.sendFollowUpMessage!=='function')throw Error();await window.openai.sendFollowUpMessage({prompt,title:'만기 복습 2차 결과를 기록할까요?'});$('record-status').textContent='전송했습니다. 채팅에서 기록 완료를 확인하세요.'}catch(e){await navigator.clipboard?.writeText(prompt);$('record-status').textContent='자동 전송이 안 되어 결과를 클립보드에 복사했습니다.'}finally{b.disabled=false}}}
})();</script></body></html>
